name: Native invalidation probe
on:
  push:
    branches: [test/native-review-invalidation]
permissions:
  contents: read
  checks: write
  actions: write
jobs:
  attestation-probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Temporary isolated check for lifecycle experiment'
  invalidate-probe:
    needs: attestation-probe
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/actions/jobs/119083936660/rerun"
          gh api "repos/$REPO/actions/runs/39558430800/jobs" --jq '.jobs[] | {id,name,status,conclusion,check_run_url}'
